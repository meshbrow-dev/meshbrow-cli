# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

project_name: meshbrow

before:
  hooks:
    - go mod tidy

builds:
  - id: meshbrow
    main: .
    binary: meshbrow
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/meshbrow-dev/meshbrow-cli/cmd.Version={{.Version}}
      - -X github.com/meshbrow-dev/meshbrow-cli/cmd.Commit={{.Commit}}
      - -X github.com/meshbrow-dev/meshbrow-cli/cmd.BuildDate={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: meshbrow
    repository:
      owner: meshbrow-dev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: meshbrow-bot
      email: bot@meshbrow.dev
    directory: Formula
    homepage: "https://meshbrow.dev"
    description: "CLI for the Meshbrow Managed Browser Fleet"
    license: "MIT"
    install: |
      bin.install "meshbrow"
    test: |
      system "#{bin}/meshbrow", "version"

release:
  github:
    owner: meshbrow-dev
    name: meshbrow-cli
  prerelease: auto
